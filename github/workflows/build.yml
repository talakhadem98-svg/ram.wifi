name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: te
      - name: Unzip project
        run: unzip -q netboost.zip
      - name: Prepare Android project
        run: bash netboost/scripts/setup-android.sh
      - name: Build debug APK
        working-directory: netboost/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NetBoost-apk
          path: netboost/android/app/build/outputs/apk/debug/app-debug.apk
